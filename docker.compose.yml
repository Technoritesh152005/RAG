version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

backend-api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/server.js"]
    ports:
      - "4000:4000"
    env_file:
      - ./Backend/.env
    environment:
      - REDIS_URL=redis://redis:6379   # service name, not localhost — Compose's internal DNS
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s


backend-worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - ./Backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    # no ports exposed — worker has no HTTP server, it only
    # consumes jobs from the BullMQ queue

volumes:
  redis_data: